<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for keeping</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/location.css" />

    <script>
      document.addEventListener('DOMContentLoaded', function() {

        // ---------- HAMBURGER MENU ----------

        var hamburger = document.querySelector('.mobile-menu');

        hamburger.addEventListener('click', function() {
          var menu = document.getElementById('menu');
          menu.classList.toggle('show');
        });


        // ---------- FILTER PANEL ----------

        var filterToggle = document.getElementById('filter-toggle');
        var filterPanel = document.getElementById('filter-panel');
        var closeFilter = document.getElementById('close-filter');

        function openFilters() {
          filterPanel.hidden = false;
          filterToggle.setAttribute('aria-expanded', 'true');
        }

        function closeFilters() {
          filterPanel.hidden = true;
          filterToggle.setAttribute('aria-expanded', 'false');
        }

        filterToggle.addEventListener('click', openFilters);
        closeFilter.addEventListener('click', closeFilters);

      });
    </script>
  </head>

  <body class="home">

    <!-- ---------- HEADER ---------- -->

    <header>
      <h1><a href="index.html">for &mdash; keeping</a></h1>
      <span class="mobile-menu">&#8801;</span>
      <nav>
        <ul id="menu">
          <li><a href="index.html" class="active">archive</a></li>
          <li><a href="map.html">map</a></li>
          <li><a href="about.html">about</a></li>
        </ul>
      </nav>
    </header>


    <!-- ---------- ARCHIVE CONTROLS ---------- -->

    <div class="archive-controls">
      <div class="filter-wrapper">
        <button
          class="filter-toggle"
          id="filter-toggle"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          filter
        </button>

        <aside class="filter-panel" id="filter-panel" hidden>
          <button
            class="close-filter"
            id="close-filter"
            aria-label="Close filters"
          >
            &times;
          </button>

          <p class="filter-heading">filter by</p>
          <div class="archive-filters">
            <button class="filter-button active" data-filter="all">all</button>
            <button class="filter-button" data-filter="comfort">comfort</button>
            <button class="filter-button" data-filter="wonder">wonder</button>
            <button class="filter-button" data-filter="savor">savor</button>
          </div>
        </aside>
      </div>

      <button class="add-memory-button" id="add-memory-button">
        + add a memory
      </button>
    </div>


    <!-- ---------- MEMORY ARCHIVE ---------- -->

    <main id="archive">
      <div id="memory-container"></div>

      <!-- ---------- MEMORY OVERLAY ---------- -->

      <div class="memory-overlay" id="memory-overlay" hidden>
        <div class="memory-overlay-content">
          <button class="save-memory-button" id="save-memory-button">
            save
          </button>
          <button class="close-overlay" aria-label="Close memory">
            &times;
          </button>
          <div id="memory-details"></div>
        </div>
      </div>


      <!-- ---------- ADD MEMORY OVERLAY ---------- -->

      <div class="memory-overlay" id="add-memory-overlay" hidden>
        <div class="memory-overlay-content add-memory-content">
          <button
            class="close-overlay"
            id="close-add-memory"
            aria-label="Close add memory form"
          >
            &times;
          </button>

          <h2 class="add-memory-heading">add a memory</h2>

          <form id="add-memory-form">
            <label for="new-memory-title">title</label>
            <input
              type="text"
              id="new-memory-title"
              name="title"
              placeholder="Give this memory a title"
              required
            />

            <label for="new-memory-date">date</label>
            <input
              type="date"
              id="new-memory-date"
              name="date"
              required
            />

            <label for="new-memory-description">description</label>
            <textarea
              id="new-memory-description"
              name="description"
              placeholder="Write something about this memory..."
              rows="4"
            ></textarea>

            <fieldset class="add-memory-tags">
              <legend>TAGS</legend>
              <label>
                <input type="checkbox" name="tags" value="comfort" />
                comfort
              </label>
              <label>
                <input type="checkbox" name="tags" value="wonder" />
                wonder
              </label>
              <label>
                <input type="checkbox" name="tags" value="savor" />
                savor
              </label>
            </fieldset>

            <label for="new-memory-media">PHOTOS AND VIDEOS</label>
            <input
              type="file"
              id="new-memory-media"
              name="media"
              accept="image/*,video/*"
              multiple
              required
            />

            <p class="upload-note">
              You can select multiple photos and videos.
            </p>

            <button type="submit" class="submit-memory-button">
              SAVE MEMORY
            </button>
            <p id="add-memory-message" role="status"></p>
          </form>
        </div>
      </div>
    </main>


    <!-- ---------- JAVASCRIPT FILES ---------- -->

    <script src="js/memories.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/archive.js" defer></script>
    <script src="js/location-picker.js" defer></script>

  </body>
</html>
